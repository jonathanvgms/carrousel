<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Carrusel de imágenes</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="stage">
    <!-- Fondo ambiental difuminado (la misma imagen activa, borrosa) -->
    <div class="ambient" id="ambient" aria-hidden="true"></div>

    <button class="nav nav--prev" id="prevBtn" aria-label="Imagen anterior" hidden>&#10094;</button>

    <!-- Marco tipo retrato -->
    <figure class="frame">
      <div class="frame__mat">
        <div class="carousel" id="carousel" aria-roledescription="carrusel" aria-label="Galería de imágenes">
          <div class="carousel__track" id="track"></div>
        </div>
      </div>
    </figure>

    <button class="nav nav--next" id="nextBtn" aria-label="Imagen siguiente" hidden>&#10095;</button>

    <div class="dots" id="dots" hidden></div>

    <!-- Logo de la escuela: abajo a la derecha -->
    <img class="logo" src="et12.svg" alt="Logo de la escuela ET12" />

    <div class="status" id="status">Cargando imágenes…</div>
  </div>

  <script src="carousel.js"></script>
</body>
</html>
