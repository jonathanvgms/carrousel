<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Carrusel de imágenes</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="carousel" id="carousel" aria-roledescription="carrusel" aria-label="Galería de imágenes">
    <!-- Fondo: la imagen activa, difuminada -->
    <div class="carousel__ambient" id="ambient" aria-hidden="true"></div>

    <!-- Las diapositivas (la foto completa, en vertical) se insertan desde carousel.js -->
    <div class="carousel__track" id="track"></div>

    <button class="carousel__arrow carousel__arrow--prev" id="prevBtn" aria-label="Imagen anterior" hidden>
      &#10094;
    </button>
    <button class="carousel__arrow carousel__arrow--next" id="nextBtn" aria-label="Imagen siguiente" hidden>
      &#10095;
    </button>

    <div class="carousel__dots" id="dots" hidden></div>

    <!-- Logo de la escuela: abajo a la derecha -->
    <img class="carousel__logo" src="et12.svg" alt="Logo de la escuela ET12" />

    <div class="carousel__status" id="status">Cargando imágenes…</div>
  </main>

  <!-- Credenciales inyectadas en el build (Vercel). Generado por build-env.js.
       Si no existe (desarrollo local), carousel.js usa el archivo .env. -->
  <script src="env.js"></script>
  <script src="carousel.js"></script>
</body>
</html>
